<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Calculator</title>

    <!-- Connecting our CSS file with HTML -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main calculator container -->
    <div class="calculator">

        <h2>Calculator</h2>

        <!--
            Display/Input box
            readonly means user cannot type directly inside it.
            Values will be added using calculator buttons.
        -->
        <input type="text" id="display" readonly>

        <!-- Container for all calculator buttons -->
        <div class="buttons">

            <!-- Clear everything -->
            <button class="clear" onclick="clearDisplay()">C</button>

            <!-- Delete the last entered character -->
            <button onclick="deleteLast()">DEL</button>

            <!-- Division operator -->
            <button class="operator" onclick="appendValue('/')">÷</button>

            <!-- Number buttons -->
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>

            <!-- Multiplication operator -->
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>

            <!-- Subtraction operator -->
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>

            <!-- Addition operator -->
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')">0</button>

            <!-- Decimal point -->
            <button onclick="appendValue('.')">.</button>

            <!-- Calculate final answer -->
            <button class="equal" onclick="calculate()">=</button>

        </div>

    </div>

    <!--
        Connecting JavaScript file.
        It is placed at the end so HTML loads before JavaScript runs.
    -->
    <script src="script.js"></script>

</body>
</html>
